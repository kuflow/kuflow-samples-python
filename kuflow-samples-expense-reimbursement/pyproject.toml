[project]
name = "kuflow-samples-expense-reimbursement"
description = "KuFlow Python SDK samples"
license = "MIT"
readme = "README.md"
authors = [{name = "KuFlow S.L.", email = "kuflow@kuflow.com"}]
dynamic = ["version", "dependencies"]
requires-python = '>=3.11,<3.12'

[project.urls]
homepage = "https://kuflow.com/"
repository = "https://github.com/kuflow/kuflow-samples-python"
documentation = "https://docs.kuflow.com/"

[build-system]
requires = ['poetry-core (>=2.0,<3.0)']
build-backend = "poetry.core.masonry.api"

[tool.poetry]
version = "0.1.0"
requires-poetry = '>=2.0,<3.0'

[tool.poetry.dependencies]
deepmerge = "^1.1.0"
kuflow-temporal-activity-kuflow = "^3.1.0"
kuflow-temporal-workflow-kuflow = "^3.1.0"
kuflow-temporal-worker = "^3.1.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.1.8,<1.0.0"
pytest = "^7.2.1"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
testpaths = ["tests"]
python_files= "test_*.py"
