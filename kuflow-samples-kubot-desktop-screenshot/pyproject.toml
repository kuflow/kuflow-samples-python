[project]
name = "kuflow-samples-kubot-desktop-screenshot"
description = "KuFlow KuBot example. Take a user desktop screenshot"
license = "MIT"
readme = "README.md"
authors = [{name = "KuFlow S.L.", email = "kuflow@kuflow.com"}]
dynamic = ["version", "dependencies"]
requires-python = '>=3.11,<3.12'

[project.urls]
homepage = "https://kuflow.com/"
repository = "https://github.com/kuflow/kuflow-samples-python"
documentation = "https://docs.kuflow.com/"

[build-system]
requires = ['poetry-core (>=2.0,<3.0)']
build-backend = "poetry.core.masonry.api"

[tool.poetry]
version = "0.1.0"
packages = [{include = "kuflow_samples_kubot_desktop_screenshot"}]
requires-poetry = '>=2.0,<3.0'

[tool.poetry.dependencies]
kuflow-rest = "^3.1.0"
pillow = "^10.4.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.3.0"
ruff = ">=0.1.8,<1.0.0"
pytest = "^7.4.2"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
testpaths = ["tests"]
python_files= "test_*.py"
